<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austin CBD</title>
<meta name="description" content="Interactive map of Downtown Austin Class A office — rents, availability, owners, and lease comps.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@380;500;640&display=swap">
<style>
  :root {
    --bg: #f3efe6;
    --paper: #fffdf8;
    --ink: #1a1714;
    --muted: #6f675e;
    --line: #e3d9c8;
    --copper: #a33b22;
    --river: #1e4d40;
    --steady: #2f6a45;
    --watch: #8a4b12;
    --sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
    --display: "Fraunces", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.45;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .shell { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.75rem 1.25rem;
    padding: 0.75rem 1rem 0.7rem;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 86%, var(--bg));
  }
  .brand { font-family: var(--display); font-weight: 640; font-size: 1.5rem; letter-spacing: -0.03em; line-height: 1; }
  .sub { margin-top: 0.2rem; color: var(--muted); font-size: 0.8rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-left: auto; }
  .stat { min-width: 5.4rem; padding: 0.3rem 0.65rem 0.35rem; border: 1px solid var(--line); border-radius: 0.7rem; background: var(--paper); }
  .stat b { display: block; font-family: var(--display); font-size: 1.05rem; letter-spacing: -0.03em; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .stage { position: relative; min-height: 0; }
  .rail {
    display: none; flex-direction: column; min-height: 0; background: var(--paper); border-right: 1px solid var(--line);
  }
  .rail.open {
    display: flex; position: absolute; z-index: 6; left: 0.5rem; right: 0.5rem; bottom: 0.5rem;
    max-height: calc(100% - 1rem); border: 1px solid var(--line); border-radius: 1rem;
    box-shadow: 0 16px 50px color-mix(in srgb, var(--ink) 18%, transparent);
  }
  .tools { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.75rem; border-bottom: 1px solid var(--line); }
  .search {
    display: flex; align-items: center; gap: 0.4rem; height: 2.75rem; padding: 0 0.7rem;
    border: 1px solid var(--line); border-radius: 0.75rem; background: var(--bg);
  }
  .search input { width: 100%; border: 0; background: transparent; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip, .texty {
    border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    min-height: 2.4rem; padding: 0.4rem 0.7rem; font-size: 0.75rem;
  }
  .chip.on, .texty.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .sort { display: flex; align-items: center; gap: 0.45rem; color: var(--muted); font-size: 0.75rem; }
  .sort select { height: 2.25rem; border: 1px solid var(--line); border-radius: 0.65rem; background: var(--bg); padding: 0 0.4rem; }
  .rows { overflow: auto; min-height: 0; }
  .row {
    display: grid; grid-template-columns: auto 1fr; gap: 0.65rem; width: 100%;
    padding: 0.7rem 0.75rem; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; text-align: left;
  }
  .row.on, .row:hover { background: color-mix(in srgb, var(--river) 8%, var(--paper)); }
  .idx {
    display: grid; place-items: center; width: 1.7rem; height: 1.7rem; margin-top: 0.1rem;
    border-radius: 999px; color: var(--paper); font-size: 0.68rem; font-weight: 640;
  }
  .row strong { display: block; font-size: 0.92rem; letter-spacing: -0.02em; }
  .quiet { color: var(--muted); font-size: 0.75rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 0.3rem 0.7rem; margin-top: 0.15rem; }
  .mapwrap { position: absolute; inset: 0; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .maplibregl-ctrl-attrib { font-size: 10px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
  .legend, .dossier {
    position: absolute; z-index: 2; border: 1px solid var(--line); border-radius: 1rem;
    background: color-mix(in srgb, var(--paper) 94%, transparent);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--ink) 8%, transparent);
  }
  .legend { top: 0.75rem; left: 0.75rem; width: min(16rem, calc(100% - 5.5rem)); padding: 0.7rem 0.75rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .legend p { margin: 0; color: var(--muted); font-size: 0.75rem; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 0.55rem; }
  .swatch { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; }
  .swatch i { width: 0.7rem; height: 0.7rem; border-radius: 999px; }
  .legend-actions { display: flex; gap: 0.4rem; }
  .listbtn { position: absolute; z-index: 4; left: 0.75rem; bottom: 0.75rem; }
  .pin {
    display: grid; place-items: center; padding: 0; border: 2px solid var(--paper); border-radius: 999px;
    color: var(--paper); font-weight: 640; letter-spacing: -0.03em; line-height: 1;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 35%, transparent), 0 6px 14px color-mix(in srgb, var(--ink) 18%, transparent);
  }
  .pin.on { outline: 3px solid var(--ink); transform: scale(1.08); }
  .dossier {
    z-index: 5; right: 0.5rem; bottom: 0.5rem; left: 0.5rem; top: auto;
    max-height: min(78dvh, 44rem); overflow: auto; background: var(--paper);
  }
  .dossier[hidden] { display: none; }
  .hero {
    padding: 1rem 1rem 0.85rem;
    background: linear-gradient(160deg, color-mix(in srgb, var(--river) 82%, black), var(--ink));
    color: var(--paper);
  }
  .hero h2 { margin: 0.35rem 0 0; font-family: var(--display); font-size: 1.65rem; font-weight: 640; letter-spacing: -0.03em; line-height: 1.05; }
  .hero .quiet { color: color-mix(in srgb, var(--paper) 78%, transparent); }
  .body { display: flex; flex-direction: column; gap: 0.9rem; padding: 0.85rem 1rem 1.1rem; }
  .close-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
  .pill { display: inline-flex; align-items: center; min-height: 1.5rem; padding: 0 0.45rem; border-radius: 999px; background: var(--bg); font-size: 0.72rem; }
  .iconbtn { width: 2.4rem; height: 2.4rem; border-radius: 0.7rem; border: 1px solid var(--line); background: var(--paper); }
  .track { height: 0.45rem; border-radius: 999px; background: var(--line); overflow: hidden; }
  .track span { display: block; height: 100%; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  .metric { padding: 0.45rem 0.55rem; border-radius: 0.7rem; background: var(--bg); }
  .metric b { display: block; font-variant-numeric: tabular-nums; font-size: 0.98rem; }
  .metric span { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.03em; text-transform: uppercase; }
  .label { margin: 0 0 0.35rem; color: var(--muted); font-size: 0.68rem; font-weight: 640; letter-spacing: 0.08em; text-transform: uppercase; }
  .tenants { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .shot { display: block; width: 100%; height: 11.5rem; object-fit: cover; background: #1a1714; }
  .commentary { margin: 0; font-size: 0.9rem; line-height: 1.5; overflow-wrap: anywhere; }
  .commentary a { color: var(--copper); }
  .sale-grid { margin-top: 0.35rem; }
  .sale-grid .metric b { font-size: 0.86rem; line-height: 1.25; overflow-wrap: anywhere; }

  .comp { padding: 0.55rem 0; border-top: 1px solid var(--line); }
  .comp.head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
  .comp.out { opacity: 0.72; }
  .flag { margin: 0.2rem 0 0; color: var(--copper); font-size: 0.75rem; }
  .foot { margin: 0; color: var(--muted); font-size: 0.72rem; }
  .empty { padding: 1.2rem 0.9rem; color: var(--muted); }
  @media (min-width: 960px) {
    .stage { display: grid; grid-template-columns: 22.5rem minmax(0, 1fr); }
    .rail, .rail.open { display: flex; position: relative; inset: auto; max-height: none; border: 0; border-right: 1px solid var(--line); border-radius: 0; box-shadow: none; }
    .mapwrap { position: relative; min-width: 0; min-height: 0; }
    .dossier { top: 0.75rem; right: 0.75rem; bottom: 0.75rem; left: auto; width: min(24rem, calc(100% - 8rem)); max-height: none; }
    .listbtn, .rail-x { display: none; }
  }
  @media (max-width: 959px) {
    .stats { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
    .stat { flex: 0 0 auto; }
    .legend p { display: none; }
    .brand { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) { .pin { transition: none; } }

  .board { border: 1px solid #0b2340; border-radius: 0.75rem; overflow: hidden; background: var(--paper); }
  .board-head { margin: 0; padding: 0.48rem 0.75rem; background: #0b2340; color: #fff; font-size: 0.72rem; font-weight: 640; letter-spacing: 0.08em; text-transform: uppercase; }
  .board-body { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.7rem 0.75rem 0.8rem; }
  .sales-layer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 0.75rem; background: color-mix(in srgb, #0b2340 46%, transparent); }
  .sales-layer[hidden] { display: none; }
  .sales-panel { display: flex; flex-direction: column; width: min(1480px, 100%); height: min(90dvh, 920px); overflow: hidden; border: 1px solid #0b2340; border-radius: 0.9rem; background: var(--paper); }
  .sales-head { display: flex; align-items: center; justify-content: space-between; }
  .sales-close { border: 1px solid color-mix(in srgb, white 40%, transparent); border-radius: 999px; background: transparent; color: #fff; min-height: 2rem; padding: 0.2rem 0.7rem; }
  .sales-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); }
  .sales-tools .search { flex: 1; min-width: 14rem; }
  .sales-scroll { overflow: auto; flex: 1; }
  .comps { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.75rem; }
  .comps th, .comps td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0.38rem 0.5rem; text-align: left; vertical-align: top; white-space: nowrap; }
  .comps th { position: sticky; top: 0; z-index: 2; background: #0b2340; color: #fff; font-weight: 640; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.66rem; }
  .comps thead tr:nth-child(2) th { top: 1.65rem; }
  .comps th.fin { background: #163a63; }
  .comps td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .comps td.notes { white-space: normal; min-width: 16rem; max-width: 24rem; }
  .comps tr.austin td { background: #e7f0ea; }

  .brand-lockup { display: flex; align-items: center; gap: 0.8rem; }
  .brand-logo { display: block; height: 1.35rem; width: auto; }
  .fresh { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.28rem; color: var(--muted); font-size: 0.75rem; }
  .fresh-bar { width: 4.75rem; height: 0.42rem; border-radius: 999px; background: var(--line); overflow: hidden; }
  .fresh-bar i { display: block; height: 100%; width: 100%; }
  .fresh-bar.green i { background: #1f8a4c; }
  .fresh-bar.yellow i { background: #d4a017; }
  .fresh-bar.red i { background: #c0392b; }
  header.top .texty { align-self: center; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand-lockup">
      <a href="https://www.pky.com/" target="_blank" rel="noreferrer"><img class="brand-logo" src="parkway.svg" alt="Parkway"></a>
      <div>
        <div class="brand">Austin CBD</div>
        <div class="sub" id="sub"></div>
        <div class="fresh" id="fresh"></div>
      </div>
    </div>
    <button class="texty" id="openSales" type="button">Sale comps</button>
    <div class="stats" id="stats"></div>
  </header>
  <div class="stage">
    <aside class="rail" id="rail">
      <div class="tools">
        <div class="close-row">
          <label class="search" style="flex:1">
            <input id="q" type="search" placeholder="Search name, tenant, owner" aria-label="Search buildings">
          </label>
          <button class="iconbtn rail-x" id="closeList" type="button" aria-label="Close list">✕</button>
        </div>
        <div class="chips" id="chips"></div>
        <label class="sort">Sort
          <select id="sort" aria-label="Sort buildings">
            <option value="avail">Availability</option>
            <option value="leased">% leased</option>
            <option value="rent">Asking rent</option>
            <option value="sf">Building size</option>
            <option value="year">Year built</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
      <div class="rows" id="rows"></div>
    </aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend">
        <p>Pin color is share available. Larger pins are bigger buildings. Hover a pin for the full record.</p>
        <div class="swatches">
          <span class="swatch"><i style="background:var(--river)"></i> Under 8%</span>
          <span class="swatch"><i style="background:var(--steady)"></i> 8–25%</span>
          <span class="swatch"><i style="background:var(--watch)"></i> 25–45%</span>
          <span class="swatch"><i style="background:var(--copper)"></i> 45%+ open</span>
        </div>
        <div class="legend-actions">
          <button class="texty" id="fitCore" type="button">Downtown core</button>
          <button class="texty" id="fitAll" type="button">Fit all</button>
        </div>
      </div>
      <button class="texty listbtn" id="openList" type="button">Buildings</button>
      <article class="dossier" id="dossier" hidden></article>
    </div>
  </div>
</div>

<div class="sales-layer" id="sales" hidden>
  <div class="sales-panel" role="dialog" aria-label="Sale comps">
    <div class="board-head sales-head">
      <span>Sale comps</span>
      <button class="sales-close" id="closeSales" type="button">Close</button>
    </div>
    <div class="sales-tools">
      <label class="search"><input id="salesQ" type="search" placeholder="Filter building, city, buyer, seller" aria-label="Filter sale comps"></label>
      <span class="quiet" id="salesCount"></span>
    </div>
    <div class="sales-scroll"><table class="comps" id="salesTable"></table></div>
  </div>
</div>

}
function tone(available) {

  if (v < 0.45) return "var(--watch)";

}
function pinPx(sf) {

}
function pct(n, d = 1) {

}
function money(n, digits = 2) {
  if (n == null || Number.isNaN(n)) return "—";

}
function sf(n) { return Math.round(n).toLocaleString("en-US"); }

}
function formatTi(raw) {

}

}
function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const list = buildings.filter((b) => {
    if (q) {
      const hay = [b.name, b.address, b.owner, b.year, ...b.tenants, b.commentary].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (band === "block" && b.availSf < 50000) return false;
    if (band === "sublease" && b.subleaseSf < 20000) return false;
    if (band === "new" && !(b.yearSort && b.yearSort >= 2020)) return false;
    if (band === "legacy" && !(b.yearSort && b.yearSort < 2000)) return false;
    if (band === "full" && b.availSf > 0) return false;
    return true;
  });
  const cmp = {
    avail: (a, b) => (b.available ?? 0) - (a.available ?? 0) || b.availSf - a.availSf,
    leased: (a, b) => (b.leased ?? 0) - (a.leased ?? 0),
    rent: (a, b) => (b.askingNnn ?? -1) - (a.askingNnn ?? -1),
    sf: (a, b) => b.sf - a.sf,
    year: (a, b) => (b.yearSort ?? 0) - (a.yearSort ?? 0),

  return list.sort(cmp[$("sort").value]);
}
function renderChrome(list) {
  const total = list.reduce((s, b) => s + b.sf, 0);
  const leasedSf = list.reduce((s, b) => s + b.sf * (b.leased ?? 0), 0);
  const avail = list.reduce((s, b) => s + b.availSf, 0);
  let rentW = 0, rentSf = 0;
  for (const b of list) if (b.askingNnn != null) { rentW += b.askingNnn * b.sf; rentSf += b.sf; }
  $("sub").textContent = "Class A office · " + PACK.asOf;
{
  const start = new Date(PACK.costar);
  const months = (Date.now() - start.getTime()) / (1000 * 60 * 60 * 24 * (365.25 / 12));
  const tone = months < 2.5 ? "green" : months < 3 ? "yellow" : "red";
  const word = tone === "green" ? "Current" : tone === "yellow" ? "Due soon" : "Update due";
  $("fresh").innerHTML = "<span>Last updated " + esc(PACK.costar) + '</span><span class="fresh-bar ' + tone + '" title="' + word + '. Green under 2.5 months, yellow until 3 months, red after 3."><i></i></span>';
}
  $("stats").innerHTML = [
    [String(list.length), "Buildings"],
    [compactSf(total), "Inventory SF"],
    [pct(total ? leasedSf / total : 0, 0), "Wtd leased"],
    [compactSf(avail), "Available SF"],
    [rentSf ? money(rentW / rentSf, 0) : "—", "Wtd ask NNN"],
  ].map(([v, l]) => '<div class="stat"><b>' + esc(v) + "</b><span>" + esc(l) + "</span></div>").join("");
  $("openList").textContent = list.length + " buildings";
  $("rows").innerHTML = list.length ? list.map((b) => `
    <button class="row${activeId === b.id ? " on" : ""}" type="button" data-id="${esc(b.id)}">
      <span class="idx" style="background:${tone(b.available)}">${b.num ?? "·"}</span>
      <span>
        <strong>${esc(b.name)}</strong>
        <span class="quiet">${esc(b.address)} · ${esc(b.year)}</span>
        <span class="meta quiet"><em>${compactSf(b.sf)} SF</em><em>${pct(b.leased)} leased</em><em>${compactSf(b.availSf)} avail</em><em>${b.askingNnn == null ? "—" : money(b.askingNnn, 0) + " NNN"}</em></span>
      </span>
    </button>`).join("") : '<p class="empty">No buildings match that filter.</p>';
  markers.forEach(({ el, b }) => {
    const on = list.some((x) => x.id === b.id);
    el.style.display = on ? "" : "none";
    el.classList.toggle("on", activeId === b.id);
    el.style.zIndex = activeId === b.id ? "8" : "1";
  });
}
function metric(label, value) {
  return '<div class="metric"><b>' + esc(value) + "</b><span>" + esc(label) + "</span></div>";
}
function compHtml(c) {
  const bits = [
    c.sf != null ? sf(c.sf) + " SF" : null,
    c.termMo != null ? Math.round(c.termMo) + " mo" : null,
    c.ti ? formatTi(c.ti) + " TI" : null,
    c.dealType || null,
    c.commencement || null,
  ].filter(Boolean);
  const extra = [
    c.opex != null ? "opex " + money(c.opex) : "",
    formatFree(c.freeRent),
    c.bumps ? "bumps " + formatBumps(c.bumps) : "",
    c.expiration ? "exp " + c.expiration : "",

  return `<div class="comp${c.include ? "" : " out"}">
    <div class="head"><strong>${esc(c.tenant)}</strong><b>${esc(c.rent == null ? "—" : money(c.rent) + " " + (c.rateType || "NNN"))}</b></div>
    <p class="quiet" style="margin:0.15rem 0 0">${esc(bits.join(" · "))}</p>
    ${extra.length ? '<p class="quiet" style="margin:0.1rem 0 0">' + esc(extra.join(" · ")) + "</p>" : ""}
    ${c.notes ? '<p class="quiet" style="margin:0.15rem 0 0">' + esc(c.notes) + "</p>" : ""}
    ${c.flag ? '<p class="flag">' + esc(c.flag) + "</p>" : ""}
  </div>`;
}
function salePrice(n) {
  const m = n / 1000000;
  const text = m >= 100 && Math.abs(m - Math.round(m)) < 0.05 ? m.toFixed(0) : m.toFixed(1).replace(/\.0$/, "");
  return "$" + text + "M";
}
function saleBlock(b) {
  const s = b.lastSale;
  if (!s) return '<p class="quiet" style="margin:0">Not on file.</p>';
  const cap = s.capRate == null ? "—" : (s.capRate * 100).toFixed(2) + "%";
  return '<div class="metrics sale-grid">'
    + metric("Buyer", s.buyer || "—")
    + metric("Seller", s.seller || "—")
    + metric("Sale date", s.date || "—")
    + metric("Sale price", s.price == null ? "—" : salePrice(s.price))
    + metric("$ / SF", s.psf == null ? "—" : money(s.psf, 0))

}
function show(id) {
  activeId = id;
  const b = buildings.find((x) => x.id === id);
  if (!b) { $("dossier").hidden = true; renderChrome(filtered()); return; }
  const included = b.comps.filter((c) => c.include);

  $("dossier").hidden = false;
  $("dossier").innerHTML = `
    ${b.photo ? '<img class="shot" src="' + esc(b.photo) + '" alt="Photo of ' + esc(b.name) + '">' : ""}
    <div class="hero">
      <div class="close-row">
        <span class="pill" style="background:transparent;border:1px solid color-mix(in srgb, var(--paper) 40%, transparent)">${b.num ? "Map #" + b.num : "Off the numbered map"}</span>
        <button class="iconbtn" id="closeCard" type="button" aria-label="Close record" style="color:var(--ink)">✕</button>
      </div>
      <h2>${esc(b.name)}</h2>
      <p class="quiet" style="margin:0.25rem 0 0">${esc(b.address)}, ${esc(b.city)} · Built ${esc(b.year)}</p>
    </div>
    <div class="body">
      <p style="margin:0;white-space:pre-line"><span class="quiet">Owner · </span>${esc(b.owner || "Not listed")}</p>
      <section class="board"><h3 class="board-head">Last sale</h3><div class="board-body">${saleBlock(b)}</div></section>
      <section class="board">
        <h3 class="board-head">Building metrics</h3>
        <div class="board-body">
          <div>
            <div class="track" aria-hidden><span style="width:${Math.min(100, (b.available ?? 0) * 100)}%;background:${tone(b.available)}"></span></div>
            <p class="quiet" style="margin:0.35rem 0 0">${pct(b.available)} available · ${sf(b.directSf)} SF direct · ${sf(b.subleaseSf)} SF sublease</p>
          </div>
          <div class="metrics">
            ${metric("Building SF", sf(b.sf))}
            ${metric("% leased", pct(b.leased))}
            ${metric("% available", pct(b.available))}
            ${metric("SF available", sf(b.availSf))}
            ${metric("Direct available", sf(b.directSf))}
            ${metric("Sublease available", sf(b.subleaseSf))}
            ${metric("Max ask NNN", b.askingNnn == null ? "—" : money(b.askingNnn))}
            ${metric("Max FS ask", b.fsRent == null ? "—" : money(b.fsRent))}
            ${metric("Opex / SF", b.opex == null ? "—" : money(b.opex))}
            ${metric("Comp SF", sf(b.compSf))}
            ${metric("Wtd avg start", b.wtdRent == null ? "—" : money(b.wtdRent) + " NNN")}
            ${metric("Avg TI / SF", b.avgTi == null ? "—" : money(b.avgTi, b.avgTi % 1 === 0 ? 0 : 1))}
          </div>

      </section>
      <section class="board">

      </section>
      <section class="board">

      </section>

      <section class="board">

        <div class="board-body"><p class="foot">Source workbook: Austin Class A CBD office, ${esc(PACK.asOf)}. RBA, percent leased, and availability checked against a CoStar export dated ${esc(PACK.costar)}. Asking rent is the building maximum net. Weighted averages use comps marked for inclusion.</p></div>
      </section>
    </div>`;
  $("closeCard").onclick = () => { activeId = null; $("dossier").hidden = true; renderChrome(filtered()); };
  renderChrome(filtered());
}
function spread() {
  if (!map) return;
  const items = [...markers.values()].filter((m) => m.el.style.display !== "none");
  const pts = items.map((m) => {
    const p = map.project([m.b.lng, m.b.lat]);
    return { m, x: p.x, y: p.y, ox: 0, oy: 0 };
  });
  for (let k = 0; k < 16; k++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        const geo = Math.hypot((a.m.b.lng - b.m.b.lng) * 92000, (a.m.b.lat - b.m.b.lat) * 111320);
        if (geo > 80) continue;
        const dx = a.x + a.ox - (b.x + b.ox);
        const dy = a.y + a.oy - (b.y + b.oy);
        const dist = Math.hypot(dx, dy) || 0.01;
        if (dist >= 38) continue;
        const push = (38 - dist) / 2;
        const ux = dx / dist, uy = dy / dist;
        a.ox += ux * push; a.oy += uy * push;
        b.ox -= ux * push; b.oy -= uy * push;
      }
    }
  }
  for (const p of pts) p.m.marker.setOffset([Math.max(-56, Math.min(56, p.ox)), Math.max(-56, Math.min(56, p.oy))]);
}
function fly(b) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  map.flyTo({ center: [b.lng, b.lat], zoom: Math.max(map.getZoom(), 16), duration: reduce ? 0 : 650 });
}
function fit(mode) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (mode === "core") {
    map.fitBounds([[-97.7535, 30.2615], [-97.7385, 30.2728]], { padding: 56, duration: reduce ? 0 : 700 });
    return;
  }
  const bounds = new maplibregl.LngLatBounds();
  const source = filtered();
  for (const b of (source.length ? source : buildings)) bounds.extend([b.lng, b.lat]);
  map.fitBounds(bounds, { padding: 56, duration: reduce ? 0 : 700, maxZoom: 15 });
}
function refresh() { renderChrome(filtered()); spread(); }

$("chips").innerHTML = BANDS.map(([id, label]) => '<button class="chip' + (id === band ? " on" : "") + '" type="button" data-band="' + id + '">' + label + "</button>").join("");
$("chips").onclick = (e) => {

const DEALS = JSON.parse(document.getElementById("deals").textContent);
function dealMoney(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
function dealRate(v) {
  if (v == null || v === "") return "—";
  if (typeof v === "number") return (v * 100).toFixed(2) + "%";
  return v;
}
function dealDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
}
function dealCell(d, key) {
  const v = d[key];
  if (key === "sf" && typeof v === "number") return Math.round(v).toLocaleString("en-US");
  if (key === "leased" && typeof v === "number") return (v * 100).toFixed(1) + "%";
  if (key === "date") return dealDate(v);
  if ((key === "price" || key === "noi" || key === "uw") && typeof v === "number") return dealMoney(v);
  if ((key === "psf" || key === "uwPsf") && typeof v === "number") return dealMoney(v);
  if (key === "cap" || key === "uwCap" || key === "delta") return dealRate(v);
  return v ? esc(v) : "—";
}
const DEAL_COLS = [
  ["building","Building",0,0],["location","Location",0,0],["submarket","Submarket",0,0],
  ["sf","SF",0,1],["leased","% Leased",0,1],["date","Sale date",0,0],
  ["price","Sale price",0,1],["psf","$/SF",0,1],["cap","Cap rate",0,1],
  ["buyer","Buyer",0,0],["seller","Seller",0,0],
  ["terms","Terms",1,0],["lender","Lender",1,0],["uw","UW price",1,1],
  ["uwPsf","UW $/SF",1,1],["noi","Year 1 NOI",1,1],["uwCap","UW cap",1,1],
  ["delta","Delta",1,1],["notes","Deal notes",1,0]
];
function renderSales() {
  const q = ($("salesQ").value || "").trim().toLowerCase();
  const rows = DEALS.filter((d) => !q || [d.building, d.location, d.submarket, d.buyer, d.seller, d.notes, d.lender].join(" ").toLowerCase().includes(q));
  $("salesCount").textContent = rows.length + " of " + DEALS.length + " trades";
  const head1 = '<tr><th colspan="11">Deal</th><th class="fin" colspan="8">Financing</th></tr>';
  const head2 = "<tr>" + DEAL_COLS.map((c) => '<th class="' + (c[2] ? "fin" : "") + '">' + c[1] + "</th>").join("") + "</tr>";
  const body = rows.map((d) => {
    const cls = String(d.location || "").includes("Austin") ? ' class="austin"' : "";
    const tds = DEAL_COLS.map((c) => {
      const classes = [];
      if (c[3]) classes.push("num");
      if (c[0] === "notes") classes.push("notes");
      const raw = c[0] === "notes" || c[0] === "terms" || c[0] === "buyer" || c[0] === "seller" || c[0] === "building" || c[0] === "location" || c[0] === "submarket" || c[0] === "lender"
        ? (d[c[0]] ? esc(d[c[0]]) : "—")
        : dealCell(d, c[0]);
      return '<td class="' + classes.join(" ") + '">' + raw + "</td>";
    }).join("");
    return "<tr" + cls + ">" + tds + "</tr>";
  }).join("");
  $("salesTable").innerHTML = "<thead>" + head1 + head2 + "</thead><tbody>" + body + "</tbody>";
}
$("openSales").onclick = () => { $("sales").hidden = false; renderSales(); };
$("closeSales").onclick = () => { $("sales").hidden = true; };
$("salesQ").oninput = renderSales;
$("sales").addEventListener("click", (e) => { if (e.target.id === "sales") $("sales").hidden = true; });

addEventListener("keydown", (e) => { if (e.key === "Escape") { $("sales").hidden = true; activeId = null; $("dossier").hidden = true; renderChrome(filtered()); } });

map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
  center: [-97.7448, 30.2672],
  zoom: 14,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
for (const b of buildings) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "pin";
  el.style.background = tone(b.available);
  const size = pinPx(b.sf);
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.fontSize = b.num ? (size > 34 ? "12px" : "10px") : "0px";
  el.textContent = b.num ? String(b.num) : "•";
  el.setAttribute("aria-label", b.name + ", " + b.address);
  el.addEventListener("mouseenter", () => show(b.id));
  el.addEventListener("click", (event) => { event.stopPropagation(); show(b.id); fly(b); });

  markers.set(b.id, { marker, el, b });

map.on("move", spread);
map.on("click", () => { activeId = null; $("dossier").hidden = true; renderChrome(filtered()); });
map.once("load", () => {
